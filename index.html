<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Zorplay Games</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header class="header">
            <h1>Zorplay Games</h1>
            <p>Games. Entertainment. Fun.</p>
        </header>


        <main class="main-content">

            <section class="welcome-card">

                <h2>Welcome to Zorplay Games</h2>

                <p>
                    Subscribe to Zorplay Games and enjoy
                    our entertainment service.
                </p>

                <button
                    id="subscribeBtn"
                    class="primary-btn">
                    Subscribe
                </button>

            </section>


           <section class="unsubscribe-card">

    <h3>Already subscribed?</h3>

    <p>
        Enter your Moov Gabon mobile number
        to unsubscribe from Zorplay Games.
    </p>

    <div class="unsubscribe-form">

        <input
            type="tel"
            id="msisdnInput"
            placeholder="Example: 241XXXXXXXX"
            autocomplete="tel"
        >

        <button
            id="unsubscribeBtn"
            class="secondary-btn">
            Unsubscribe
        </button>

    </div>

</section>


            <div id="message"
                 class="message">
            </div>

        </main>


        <footer class="footer">

            <p>
                © 2026 Zorplay Games
            </p>

            <div class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms & Conditions</a>
            </div>

        </footer>

    </div>

    <script src="app.js"></script>

</body>
</html>
