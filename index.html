<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Zorplay Games</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header class="header">
            <h1>Zorplay Games</h1>
            <p>Games. Entertainment. Fun.</p>
        </header>


        <main class="main-content">

            <section class="welcome-card">

                <h2>Welcome to Zorplay Games</h2>

                <p>
                    Subscribe to Zorplay Games and enjoy
                    our entertainment service.
                </p>

                <button
                    id="subscribeBtn"
                    class="primary-btn">
                    Subscribe
                </button>

            </section>


            <!-- Unsubscribe removed from Portal -->


            <div id="message"
                 class="message">
            </div>

        </main>


        <footer class="footer">

            <p>
                © 2026 Zorplay Games
            </p>

            <div class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms & Conditions</a>
            </div>

        </footer>

    </div>


    <!-- ==========================================
         SUBSCRIPTION CONFIRMATION MODAL
         ========================================== -->

    <div id="confirmationModal"
         class="modal-overlay">

        <div class="confirmation-modal">

            <h2>Confirm Subscription</h2>

            <p>
                Are you sure you want to subscribe
                to this service for 150 XOF/day?
            </p>

            <div class="modal-buttons">

                <button
                    id="cancelSubscribeBtn"
                    class="cancel-btn">
                    Cancel
                </button>

                <button
                    id="confirmSubscribeBtn"
                    class="confirm-btn">
                    Confirm
                </button>

            </div>

        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
